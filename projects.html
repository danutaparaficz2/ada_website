<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADA Shared Projects</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script defer src="data-renderer.js?v=20260511b"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .page-section { display: none; }
        .page-section:target { display: block; }
        #projects-home:not(:has(~ .page-section:target)) { display: block; }
        #projects-home:has(~ .page-section:target) { display: none; }
        .prose-text p { margin-bottom: 1.25rem; line-height: 1.6; color: #374151; }
        .project-credit {
            margin-top: 1.5rem;
            padding: 0.875rem 1rem;
            border-left: 4px solid #2563eb;
            background: #eff6ff;
            border-radius: 0 0.75rem 0.75rem 0;
        }
        .project-credit a {
            color: #1d4ed8;
            font-weight: 700;
            text-decoration: none;
        }
        .project-credit a:hover { text-decoration: underline; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <nav class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 py-3">
            <div class="flex flex-wrap gap-4 text-[11px] font-bold uppercase tracking-widest text-slate-600">
                <a href="ada_better.html#home-view" class="hover:text-red-600 transition">About</a>
                <a href="projects.html" class="hover:text-red-600 transition">Projects</a>
                <a href="team.html" class="hover:text-red-600 transition">Team</a>
                <a href="publications.html" class="hover:text-red-600 transition">Publications</a>
                <a href="ada_better.html#news" class="hover:text-red-600 transition">News</a>
                <a href="ada_better.html#contact" class="hover:text-red-600 transition">Contact</a>
            </div>
        </div>
    </nav>
    <header class="max-w-6xl mx-auto px-6 py-10 border-b border-slate-200">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight">Shared ADA Projects</h1>
            </div>
            <div class="flex flex-wrap gap-3 text-xs font-bold uppercase tracking-widest">
                <a href="ada_better.html#projects" class="inline-flex items-center px-3 py-2 rounded-md border border-slate-300 hover:bg-slate-100 transition" aria-label="ADA Projects">
                    <img src="images/logo.png" alt="ADA" class="h-7 w-auto object-contain">
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-10 space-y-16">
        <div id="projects-home" class="space-y-12">
            <div>
                <h2 class="text-4xl font-bold tracking-tight">Current Research & Projects</h2>
                <p class="text-slate-500 mt-2">Pioneering solutions in Deep Learning, Computer Vision, and Retrieval-Augmented Generation.</p>
            </div>

            <div id="projects-active-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>

            <div>
                <h3 class="text-2xl font-bold tracking-tight mb-6">Archive Projects</h3>
                <div id="projects-archive-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
            </div>
        </div>

        <div id="active-project-details"></div>

        <div id="archive-project-details"></div>
    </main>
</body>
</html>
